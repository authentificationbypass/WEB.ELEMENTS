<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isometric Grid Pattern</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .iso-bg {
    position: fixed;
    inset: 0;
    background: #07070f;
  }

  .iso-bg svg { width: 100%; height: 100%; }

  .iso-line {
    stroke: rgba(100,120,255,0.12);
    stroke-width: 1;
  }

  .iso-line-accent {
    stroke: rgba(100,120,255,0.28);
    stroke-width: 1;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #fff;
  }

  .content h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 12px;
    text-shadow: 0 0 40px rgba(100,120,255,0.3);
  }

  .content p { font-size: 15px; color: rgba(255,255,255,0.35); }
</style>
</head>
<body>
  <div class="iso-bg">
    <svg id="isoSvg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <g id="isoGroup"></g>
    </svg>
  </div>
  <div class="content">
    <h1>Isometric Grid</h1>
    <p>SVG three-axis projection lines</p>
  </div>

  <script>
    const g = document.getElementById('isoGroup');
    const W = 1400, H = 1000;
    const STEP = 50;

    function line(x1, y1, x2, y2, accent) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      el.setAttribute('x1', x1); el.setAttribute('y1', y1);
      el.setAttribute('x2', x2); el.setAttribute('y2', y2);
      el.setAttribute('class', accent ? 'iso-line-accent' : 'iso-line');
      g.appendChild(el);
    }

    // Horizontal lines
    for (let y = -H; y < H * 2; y += STEP) {
      line(-W, y, W * 2, y, y % (STEP * 4) === 0);
    }

    // 60° diagonal lines (left-leaning)
    for (let x = -W * 2; x < W * 3; x += STEP) {
      const slope = Math.tan(Math.PI / 3);
      line(x, -H, x + H * 2 / slope, H, x % (STEP * 4) === 0);
    }

    // 120° diagonal lines (right-leaning)
    for (let x = -W * 2; x < W * 3; x += STEP) {
      const slope = Math.tan(Math.PI / 3);
      line(x, -H, x - H * 2 / slope, H, x % (STEP * 4) === 0);
    }
  </script>
</body>
</html>
