<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexagon Grid Pattern</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080810;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .hex-bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    opacity: 0.5;
  }

  .hex-bg svg {
    width: 100%;
    height: 100%;
  }

  .hex-pattern polygon {
    fill: none;
    stroke: rgba(99,102,241,0.35);
    stroke-width: 0.8;
  }

  /* Highlight some hexagons */
  .hex-pattern polygon:nth-child(5n)  { fill: rgba(99,102,241,0.06); }
  .hex-pattern polygon:nth-child(7n)  { fill: rgba(236,72,153,0.06); }
  .hex-pattern polygon:nth-child(11n) { fill: rgba(6,182,212,0.06); }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #fff;
  }

  .content h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 12px;
    text-shadow: 0 0 40px rgba(99,102,241,0.4);
  }

  .content p { font-size: 15px; color: rgba(255,255,255,0.35); }
</style>
</head>
<body>
  <div class="hex-bg">
    <svg id="hexSvg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <g class="hex-pattern" id="hexGroup"></g>
    </svg>
  </div>
  <div class="content">
    <h1>Hexagon Grid</h1>
    <p>SVG polygon tiling pattern</p>
  </div>

  <script>
    const group = document.getElementById('hexGroup');
    const R = 36; // circumradius
    const h = R * Math.sqrt(3);
    const cols = Math.ceil(1300 / (h)) + 1;
    const rows = Math.ceil(900 / (R * 1.5)) + 1;

    function hexPoints(cx, cy, r) {
      return Array.from({length: 6}, (_, i) => {
        const a = Math.PI / 180 * (60 * i - 30);
        return `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
      }).join(' ');
    }

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const cx = col * h + (row % 2 ? h / 2 : 0);
        const cy = row * R * 1.5;
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', hexPoints(cx, cy, R - 1));
        group.appendChild(poly);
      }
    }
  </script>
</body>
</html>
