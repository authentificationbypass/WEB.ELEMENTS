<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noise Texture Pattern</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .noise-bg {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1a0a2e, #0a1a2e, #0a2e1a);
    animation: color-shift 12s ease-in-out infinite alternate;
  }

  @keyframes color-shift {
    0%   { background: linear-gradient(135deg, #1a0a2e, #0a1a2e, #0a2e1a); }
    33%  { background: linear-gradient(135deg, #2e0a1a, #1a0a2e, #0a1a2e); }
    66%  { background: linear-gradient(135deg, #0a1a2e, #0a2e1a, #1a2e0a); }
    100% { background: linear-gradient(135deg, #2e1a0a, #1a2e0a, #0a1a2e); }
  }

  .noise-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #fff;
    mix-blend-mode: soft-light;
  }

  .content h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 12px;
  }

  .content p { font-size: 15px; color: rgba(255,255,255,0.7); }
</style>
</head>
<body>
  <div class="noise-bg"></div>
  <svg class="noise-overlay" xmlns="http://www.w3.org/2000/svg">
    <filter id="noise-filter">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.65"
        numOctaves="3"
        stitchTiles="stitch"
        result="noiseOut"/>
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#noise-filter)" opacity="0.08"/>
  </svg>
  <div class="content">
    <h1>Noise Texture</h1>
    <p>SVG feTurbulence grain overlay</p>
  </div>
</body>
</html>
