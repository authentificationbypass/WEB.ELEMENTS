<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit Board Pattern</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #030808;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  .circuit-bg {
    position: fixed;
    inset: 0;
  }

  .circuit-bg svg { width: 100%; height: 100%; }

  .trace {
    fill: none;
    stroke: rgba(0, 255, 180, 0.18);
    stroke-width: 1.5;
    stroke-linecap: round;
  }

  .node {
    fill: rgba(0, 255, 180, 0.35);
  }

  .pulse-line {
    fill: none;
    stroke: rgba(0,255,180,0.7);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 40 600;
    animation: circuit-pulse 4s linear infinite;
  }

  .pulse-line:nth-child(2) { animation-delay: 1.3s; stroke: rgba(0,200,255,0.7); }
  .pulse-line:nth-child(3) { animation-delay: 2.7s; stroke: rgba(120,255,80,0.7); }

  @keyframes circuit-pulse {
    from { stroke-dashoffset: 640; }
    to   { stroke-dashoffset: 0; }
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #00ffb4;
  }

  .content h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 12px;
    text-shadow: 0 0 30px rgba(0,255,180,0.5);
  }

  .content p { font-size: 15px; color: rgba(0,255,180,0.4); }
</style>
</head>
<body>
  <div class="circuit-bg">
    <svg id="circuitSvg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <g id="traceGroup"></g>
      <g id="nodeGroup"></g>
      <g id="pulseGroup"></g>
    </svg>
  </div>
  <div class="content">
    <h1>Circuit Board</h1>
    <p>Animated SVG circuit traces</p>
  </div>

  <script>
    const traceG = document.getElementById('traceGroup');
    const nodeG  = document.getElementById('nodeGroup');
    const pulseG = document.getElementById('pulseGroup');

    const GRID = 60;
    const cols = Math.ceil(1200 / GRID);
    const rows = Math.ceil(800 / GRID);

    const nodes = [];

    // Generate random L-shaped traces
    for (let i = 0; i < 80; i++) {
      const x1 = Math.floor(Math.random() * cols) * GRID + GRID / 2;
      const y1 = Math.floor(Math.random() * rows) * GRID + GRID / 2;
      const dx = (Math.floor(Math.random() * 5) - 2) * GRID;
      const dy = (Math.floor(Math.random() * 5) - 2) * GRID;
      const x2 = x1 + dx;
      const y2 = y1 + dy;

      // L-shape: go horizontal first, then vertical
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'trace');
      path.setAttribute('d', `M${x1},${y1} L${x2},${y1} L${x2},${y2}`);
      traceG.appendChild(path);

      // End nodes
      [{ x: x1, y: y1 }, { x: x2, y: y2 }].forEach(({ x, y }) => {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('class', 'node');
        c.setAttribute('cx', x);
        c.setAttribute('cy', y);
        c.setAttribute('r', Math.random() > 0.7 ? 3 : 1.5);
        nodeG.appendChild(c);
        if (Math.random() > 0.7) nodes.push({ x, y, path });
      });
    }

    // Animated pulse lines along some traces
    traceG.querySelectorAll('path').forEach((p, i) => {
      if (i % 15 === 0) {
        const pulse = p.cloneNode();
        pulse.setAttribute('class', 'pulse-line');
        if (i % 45 === 0) pulse.setAttribute('class', 'pulse-line');
        pulseG.appendChild(pulse);
      }
    });
  </script>
</body>
</html>
