<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Mesh Pattern</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .mesh-bg {
    position: fixed;
    inset: 0;
    background: #08080f;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    mix-blend-mode: screen;
    opacity: 0.55;
  }

  .blob-1 { width: 500px; height: 500px; background: #4f46e5; animation: mesh1 14s ease-in-out infinite alternate; }
  .blob-2 { width: 420px; height: 420px; background: #ec4899; animation: mesh2 18s ease-in-out infinite alternate; }
  .blob-3 { width: 380px; height: 380px; background: #06b6d4; animation: mesh3 12s ease-in-out infinite alternate; }
  .blob-4 { width: 300px; height: 300px; background: #10b981; animation: mesh4 16s ease-in-out infinite alternate; }

  @keyframes mesh1 {
    0%   { transform: translate(0px, 0px); }
    100% { transform: translate(30vw, 20vh); }
  }
  @keyframes mesh2 {
    0%   { transform: translate(60vw, 10vh); }
    100% { transform: translate(10vw, 60vh); }
  }
  @keyframes mesh3 {
    0%   { transform: translate(20vw, 60vh); }
    100% { transform: translate(70vw, 0vh); }
  }
  @keyframes mesh4 {
    0%   { transform: translate(80vw, 60vh); }
    100% { transform: translate(0vw, 30vh); }
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #fff;
  }

  .content h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 12px;
  }

  .content p { font-size: 15px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
  <div class="mesh-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div class="content">
    <h1>Gradient Mesh</h1>
    <p>Animated multi-blob gradient mesh</p>
  </div>
</body>
</html>
