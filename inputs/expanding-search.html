<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expanding Search Input</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0e0e14;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .search-wrap {
    position: relative;
    height: 48px;
  }

  .search-wrap input {
    height: 48px;
    width: 48px;
    padding: 0 14px 0 48px;
    font-size: 14px;
    color: #fff;
    background: #1a1a26;
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 50px;
    outline: none;
    cursor: pointer;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s;
    caret-color: #fff;
  }

  .search-wrap input::placeholder { color: transparent; transition: color 0.3s 0.15s; }
  .search-wrap input:focus::placeholder { color: rgba(255,255,255,0.3); }

  .search-wrap input:focus,
  .search-wrap input:not(:placeholder-shown) {
    width: 280px;
    cursor: text;
    border-color: rgba(255,255,255,0.3);
  }

  .search-wrap .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.4);
    pointer-events: none;
    font-size: 16px;
  }
</style>
</head>
<body>
  <p class="label">Expanding Search</p>
  <div class="search-wrap">
    <span class="icon">⌕</span>
    <input type="search" placeholder="Search anything..." autocomplete="off">
  </div>
</body>
</html>
