<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Label Input</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0e0e14;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .field {
    position: relative;
    width: 280px;
  }

  .field input {
    width: 100%;
    padding: 22px 16px 8px;
    font-size: 15px;
    color: #fff;
    background: #1a1a26;
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.25s;
    caret-color: #6366f1;
  }

  .field input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
  }

  .field label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    color: rgba(255,255,255,0.35);
    pointer-events: none;
    transition: top 0.25s, font-size 0.25s, color 0.25s, transform 0.25s;
  }

  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    top: 12px;
    transform: translateY(0);
    font-size: 11px;
    color: #6366f1;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <p class="label">Floating Label Input</p>
  <div class="field">
    <input type="email" id="email" placeholder=" " autocomplete="off">
    <label for="email">Email Address</label>
  </div>
  <div class="field">
    <input type="text" id="name" placeholder=" " autocomplete="off">
    <label for="name">Full Name</label>
  </div>
</body>
</html>
