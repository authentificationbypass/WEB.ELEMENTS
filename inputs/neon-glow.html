<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Glow Input</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080808;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 32px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .neon-input {
    width: 300px;
    padding: 14px 20px;
    font-size: 15px;
    color: #00f0ff;
    background: #0a0a14;
    border: 1.5px solid rgba(0, 240, 255, 0.2);
    border-radius: 8px;
    outline: none;
    transition:
      border-color 0.3s,
      box-shadow 0.3s;
    caret-color: #00f0ff;
    letter-spacing: 0.5px;
  }

  .neon-input::placeholder { color: rgba(0,240,255,0.25); }

  .neon-input:focus {
    border-color: #00f0ff;
    box-shadow:
      0 0 0 1px rgba(0,240,255,0.4),
      0 0 16px rgba(0,240,255,0.2),
      inset 0 0 16px rgba(0,240,255,0.04);
  }
</style>
</head>
<body>
  <p class="label">Neon Glow Input</p>
  <input class="neon-input" type="text" placeholder="Enter access code..." autocomplete="off" spellcheck="false">
  <input class="neon-input" type="password" placeholder="Password" autocomplete="off">
</body>
</html>
