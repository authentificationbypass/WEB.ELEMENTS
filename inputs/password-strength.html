<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Input</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0e0e14;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .pw-wrap { width: 300px; }

  .pw-input-row {
    position: relative;
    margin-bottom: 10px;
  }

  .pw-wrap input {
    width: 100%;
    padding: 14px 44px 14px 16px;
    font-size: 15px;
    color: #fff;
    background: #1a1a26;
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    outline: none;
    caret-color: #fff;
    letter-spacing: 2px;
    transition: border-color 0.3s;
  }

  .pw-wrap input:focus { border-color: rgba(255,255,255,0.3); }

  .pw-toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(255,255,255,0.4);
    font-size: 16px;
    padding: 0;
  }

  .pw-bars {
    display: flex;
    gap: 5px;
    margin-bottom: 8px;
  }

  .pw-bars .bar {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    transition: background 0.3s;
  }

  .pw-hint {
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    min-height: 18px;
    transition: color 0.3s;
  }
</style>
</head>
<body>
  <p class="label">Password Strength</p>
  <div class="pw-wrap">
    <div class="pw-input-row">
      <input type="password" id="pwInput" placeholder="Create password" autocomplete="new-password">
      <button class="pw-toggle" id="pwToggle" aria-label="Show password">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="pw-bars" id="pwBars">
      <div class="bar" id="b1"></div>
      <div class="bar" id="b2"></div>
      <div class="bar" id="b3"></div>
      <div class="bar" id="b4"></div>
    </div>
    <p class="pw-hint" id="pwHint">Start typing to check strength</p>
  </div>

  <script>
    const input = document.getElementById('pwInput');
    const toggle = document.getElementById('pwToggle');
    const hint = document.getElementById('pwHint');
    const bars = [document.getElementById('b1'), document.getElementById('b2'), document.getElementById('b3'), document.getElementById('b4')];

    const levels = [
      { color: '#ef4444', label: 'Too weak' },
      { color: '#f97316', label: 'Weak' },
      { color: '#eab308', label: 'Fair' },
      { color: '#22c55e', label: 'Strong' },
    ];

    function score(pw) {
      let s = 0;
      if (pw.length >= 8)  s++;
      if (/[A-Z]/.test(pw)) s++;
      if (/[0-9]/.test(pw)) s++;
      if (/[^A-Za-z0-9]/.test(pw)) s++;
      return s;
    }

    input.addEventListener('input', () => {
      const pw = input.value;
      if (!pw) {
        bars.forEach(b => b.style.background = '');
        hint.textContent = 'Start typing to check strength';
        hint.style.color = '';
        return;
      }
      const s = score(pw);
      bars.forEach((b, i) => {
        b.style.background = i < s ? levels[s - 1].color : 'rgba(255,255,255,0.08)';
      });
      hint.textContent = levels[s - 1].label;
      hint.style.color = levels[s - 1].color;
    });

    toggle.addEventListener('click', () => {
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
