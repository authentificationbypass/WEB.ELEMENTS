<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tag Input</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0e0e14;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .tag-field {
    width: 340px;
    min-height: 54px;
    padding: 8px 10px;
    background: #1a1a26;
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    align-items: center;
    cursor: text;
    transition: border-color 0.3s;
  }

  .tag-field:focus-within { border-color: rgba(99,102,241,0.6); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(99,102,241,0.2);
    border: 1px solid rgba(99,102,241,0.35);
    border-radius: 20px;
    font-size: 13px;
    color: #a5b4fc;
    animation: chip-pop 0.2s ease;
  }

  @keyframes chip-pop {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .chip-del {
    background: none;
    border: none;
    color: rgba(165,180,252,0.5);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    transition: color 0.15s;
  }

  .chip-del:hover { color: #ef4444; }

  .tag-input {
    background: none;
    border: none;
    outline: none;
    font-size: 14px;
    color: #fff;
    min-width: 100px;
    flex: 1;
    caret-color: #a5b4fc;
  }

  .tag-input::placeholder { color: rgba(255,255,255,0.2); }

  .hint {
    color: rgba(255,255,255,0.25);
    font-size: 12px;
  }
</style>
</head>
<body>
  <p class="label">Tag Input</p>
  <div class="tag-field" id="tagField">
    <input class="tag-input" id="tagInput" placeholder="Add a tag and press Enter…" autocomplete="off">
  </div>
  <p class="hint">Type and press Enter or comma to add tags</p>

  <script>
    const field = document.getElementById('tagField');
    const input = document.getElementById('tagInput');

    field.addEventListener('click', () => input.focus());

    input.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ',') && input.value.trim()) {
        e.preventDefault();
        addTag(input.value.replace(',', '').trim());
        input.value = '';
      }
      if (e.key === 'Backspace' && !input.value) {
        const chips = field.querySelectorAll('.chip');
        if (chips.length) chips[chips.length - 1].remove();
      }
    });

    function addTag(text) {
      if (!text) return;
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${text}<button class="chip-del" aria-label="Remove tag">×</button>`;
      chip.querySelector('.chip-del').addEventListener('click', () => chip.remove());
      field.insertBefore(chip, input);
    }

    // Seed with some tags
    ['Design', 'CSS', 'Animation'].forEach(addTag);
  </script>
</body>
</html>
