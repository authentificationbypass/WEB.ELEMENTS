<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Input</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a1a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
    overflow: hidden;
  }

  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    pointer-events: none;
  }
  .b1 { width: 360px; height: 360px; background: #7c3aed; top: -80px; left: -100px; }
  .b2 { width: 300px; height: 300px; background: #0ea5e9; bottom: -60px; right: -80px; }

  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.35; position: relative; z-index: 1; }

  /* ── COMPONENT ──────────────────────────────── */
  .glass-form {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 32px 28px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .glass-form h2 {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .glass-form input {
    width: 100%;
    padding: 12px 16px;
    font-size: 14px;
    color: #fff;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    outline: none;
    transition: background 0.3s, border-color 0.3s;
    caret-color: #fff;
  }

  .glass-form input::placeholder { color: rgba(255,255,255,0.3); }
  .glass-form input:focus {
    background: rgba(255,255,255,0.13);
    border-color: rgba(255,255,255,0.35);
  }

  .glass-form button {
    width: 100%;
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .glass-form button:hover { background: rgba(255,255,255,0.22); }
</style>
</head>
<body>
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <p class="label">Glassmorphism Input</p>
  <div class="glass-form">
    <h2>Welcome back</h2>
    <input type="email" placeholder="Email address" autocomplete="off">
    <input type="password" placeholder="Password" autocomplete="off">
    <button>Sign In</button>
  </div>
</body>
</html>
