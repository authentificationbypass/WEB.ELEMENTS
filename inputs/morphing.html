<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphing Input</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0e0e14;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .morph-input {
    width: 300px;
    padding: 14px 20px;
    font-size: 15px;
    color: #fff;
    background: #1a1a26;
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 50px;
    outline: none;
    transition:
      border-radius 0.4s cubic-bezier(0.4, 0, 0.2, 1),
      border-color 0.3s,
      box-shadow 0.3s,
      background 0.3s;
    caret-color: #ec4899;
  }

  .morph-input::placeholder { color: rgba(255,255,255,0.25); }

  .morph-input:focus {
    border-radius: 10px;
    border-color: rgba(236,72,153,0.5);
    background: #1e1a2e;
    box-shadow:
      0 0 0 3px rgba(236,72,153,0.12),
      0 8px 24px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
  <p class="label">Morphing Input</p>
  <input class="morph-input" type="text" placeholder="Click to morph…" autocomplete="off">
</body>
</html>
