<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autocomplete Input</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0e0e14;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .ac-wrap {
    position: relative;
    width: 300px;
  }

  .ac-input {
    width: 100%;
    padding: 14px 18px;
    font-size: 14px;
    color: #fff;
    background: #1a1a26;
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.25s;
    caret-color: #fff;
  }

  .ac-input:focus { border-color: rgba(255,255,255,0.3); }
  .ac-input::placeholder { color: rgba(255,255,255,0.25); }

  .ac-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: #1e1e2e;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    display: none;
    z-index: 10;
  }

  .ac-dropdown.visible { display: block; }

  .ac-item {
    padding: 12px 18px;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ac-item:hover,
  .ac-item.active {
    background: rgba(99,102,241,0.15);
    color: #fff;
  }

  .ac-item .match { color: #a5b4fc; font-weight: 600; }
</style>
</head>
<body>
  <p class="label">Autocomplete Input</p>
  <div class="ac-wrap">
    <input class="ac-input" type="text" id="acInput" placeholder="Search technologies…" autocomplete="off">
    <div class="ac-dropdown" id="acDropdown"></div>
  </div>

  <script>
    const items = ['React','Vue','Angular','Svelte','SolidJS','Astro','Next.js','Nuxt','Remix','Qwik','TypeScript','JavaScript','CSS','HTML','WebAssembly'];
    const input = document.getElementById('acInput');
    const dropdown = document.getElementById('acDropdown');

    function highlight(text, query) {
      const i = text.toLowerCase().indexOf(query.toLowerCase());
      if (i === -1) return text;
      return text.slice(0, i) + `<span class="match">${text.slice(i, i + query.length)}</span>` + text.slice(i + query.length);
    }

    function render(query) {
      const results = items.filter(it => it.toLowerCase().includes(query.toLowerCase())).slice(0, 6);
      if (!results.length || !query) { dropdown.classList.remove('visible'); return; }
      dropdown.innerHTML = results.map(r =>
        `<div class="ac-item" tabindex="0">${highlight(r, query)}</div>`
      ).join('');
      dropdown.classList.add('visible');
      dropdown.querySelectorAll('.ac-item').forEach(el => {
        el.addEventListener('mousedown', (e) => {
          e.preventDefault();
          input.value = el.textContent;
          dropdown.classList.remove('visible');
        });
      });
    }

    input.addEventListener('input', () => render(input.value));
    input.addEventListener('blur', () => setTimeout(() => dropdown.classList.remove('visible'), 150));
    input.addEventListener('focus', () => { if (input.value) render(input.value); });
  </script>
</body>
</html>
