<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Morph Button</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  .btn-gradient {
    padding: 15px 50px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    background: conic-gradient(from var(--angle), #ff0080, #ff8c00, #ffe100, #00ff80, #00c8ff, #8000ff, #ff0080);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    outline: none;
    animation: spin-gradient 3s linear infinite;
    transition: transform 0.2s, box-shadow 0.3s;
    position: relative;
  }

  .btn-gradient::before {
    content: '';
    position: absolute;
    inset: 2px;
    background: #0a0a0a;
    border-radius: 48px;
    z-index: 0;
  }

  .btn-gradient span {
    position: relative;
    z-index: 1;
    background: conic-gradient(from var(--angle), #ff0080, #ff8c00, #ffe100, #00ff80, #00c8ff, #8000ff, #ff0080);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: spin-gradient 3s linear infinite;
  }

  .btn-gradient:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255, 100, 200, 0.4);
  }

  @keyframes spin-gradient {
    to { --angle: 360deg; }
  }
</style>
</head>
<body>
  <p class="label">Gradient Morph Button</p>
  <button class="btn-gradient"><span>Premium Access</span></button>
</body>
</html>
