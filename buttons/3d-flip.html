<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Flip Button</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .btn-flip-wrap {
    perspective: 800px;
  }

  .btn-flip {
    position: relative;
    width: 180px;
    height: 52px;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    cursor: pointer;
    border: none;
    background: transparent;
    outline: none;
  }

  .btn-flip-wrap:hover .btn-flip {
    transform: rotateX(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 6px;
    backface-visibility: hidden;
  }

  .face-front {
    background: #e2e8f0;
    color: #1e293b;
  }

  .face-back {
    background: #1e293b;
    color: #e2e8f0;
    transform: rotateX(180deg);
  }
</style>
</head>
<body>
  <p class="label">3D Flip Button</p>
  <div class="btn-flip-wrap">
    <button class="btn-flip" aria-label="Sign Up">
      <span class="face face-front">Sign Up</span>
      <span class="face face-back">It's Free!</span>
    </button>
  </div>
</body>
</html>
