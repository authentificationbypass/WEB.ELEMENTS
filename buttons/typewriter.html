<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typewriter Button</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    font-family: 'Courier New', monospace;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .btn-type {
    min-width: 200px;
    padding: 14px 36px;
    font-size: 15px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    letter-spacing: 1px;
    color: #39ff14;
    background: #0f0f0f;
    border: 1px solid #39ff14;
    border-radius: 4px;
    cursor: pointer;
    outline: none;
    position: relative;
    text-align: left;
  }

  .btn-type .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #39ff14;
    vertical-align: middle;
    margin-left: 1px;
    animation: blink 0.8s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <p class="label">Typewriter Button</p>
  <button class="btn-type" id="typeBtn">
    <span id="typeText">Download</span><span class="cursor"></span>
  </button>

  <script>
    const btn = document.getElementById('typeBtn');
    const textEl = document.getElementById('typeText');
    const original = 'Download';
    const hovered = 'run ./install.sh';
    let interval = null;
    let isTyping = false;

    function typeText(target, onDone) {
      clearInterval(interval);
      let i = 0;
      textEl.textContent = '';
      isTyping = true;
      interval = setInterval(() => {
        textEl.textContent += target[i++];
        if (i >= target.length) {
          clearInterval(interval);
          isTyping = false;
          if (onDone) onDone();
        }
      }, 60);
    }

    btn.addEventListener('mouseenter', () => typeText(hovered));
    btn.addEventListener('mouseleave', () => typeText(original));
  </script>
</body>
</html>
