<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetic Button</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0c0c0c;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .btn-magnetic {
    padding: 16px 48px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #ffffff;
    background: linear-gradient(135deg, #1e1e2e, #2a1a4e);
    border: 1px solid rgba(150, 100, 255, 0.3);
    border-radius: 60px;
    cursor: pointer;
    outline: none;
    transition: box-shadow 0.4s ease, transform 0.15s ease;
    will-change: transform;
  }

  .btn-magnetic:hover {
    box-shadow:
      0 16px 48px rgba(130, 70, 255, 0.45),
      0 4px 16px rgba(130, 70, 255, 0.2);
  }

  .btn-magnetic .inner {
    display: inline-block;
    pointer-events: none;
    transition: transform 0.15s ease;
  }
</style>
</head>
<body>
  <p class="label">Magnetic Button</p>
  <button class="btn-magnetic">
    <span class="inner">Hover Near Me</span>
  </button>

  <script>
    const btn = document.querySelector('.btn-magnetic');
    const inner = btn.querySelector('.inner');
    const PULL = 0.38;
    const TEXT_PULL = 0.62;

    btn.addEventListener('mousemove', (e) => {
      const r = btn.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2);
      const dy = e.clientY - (r.top + r.height / 2);
      btn.style.transform = `translate(${dx * PULL}px, ${dy * PULL}px)`;
      inner.style.transform = `translate(${dx * TEXT_PULL}px, ${dy * TEXT_PULL}px)`;
    });

    btn.addEventListener('mouseleave', () => {
      btn.style.transform = '';
      inner.style.transform = '';
    });
  </script>
</body>
</html>
