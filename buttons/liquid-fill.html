<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Fill Button</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0e0e0e;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .btn-liquid {
    position: relative;
    padding: 15px 48px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ff6b35;
    background: transparent;
    border: 2px solid #ff6b35;
    border-radius: 6px;
    cursor: pointer;
    outline: none;
    overflow: hidden;
    transition: color 0.4s;
    z-index: 0;
  }

  .btn-liquid::before {
    content: '';
    position: absolute;
    left: 0;
    bottom: -100%;
    width: 100%;
    height: 100%;
    background: #ff6b35;
    border-radius: 50% 50% 0 0 / 30% 30% 0 0;
    transition: bottom 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: -1;
  }

  .btn-liquid:hover {
    color: #fff;
  }

  .btn-liquid:hover::before {
    bottom: 0;
    border-radius: 0;
  }
</style>
</head>
<body>
  <p class="label">Liquid Fill Button</p>
  <button class="btn-liquid">Launch</button>
</body>
</html>
