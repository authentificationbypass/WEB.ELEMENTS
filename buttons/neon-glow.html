<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Glow Button</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080808;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .btn-neon {
    padding: 14px 44px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #00f0ff;
    background: transparent;
    border: 2px solid #00f0ff;
    border-radius: 3px;
    cursor: pointer;
    outline: none;
    position: relative;
    transition: color 0.25s, background 0.25s;
    animation: neon-idle 2.4s ease-in-out infinite;
  }

  .btn-neon:hover {
    color: #080808;
    background: #00f0ff;
    animation: none;
    box-shadow:
      0 0 8px #00f0ff,
      0 0 24px #00f0ff,
      0 0 56px #00f0ff;
  }

  @keyframes neon-idle {
    0%, 100% {
      box-shadow: 0 0 4px #00f0ff, 0 0 14px #00f0ff, 0 0 28px #00f0ff;
      text-shadow: 0 0 8px #00f0ff;
    }
    50% {
      box-shadow: 0 0 2px #00f0ff, 0 0 6px #00f0ff;
      text-shadow: none;
    }
  }
</style>
</head>
<body>
  <p class="label">Neon Glow Button</p>
  <button class="btn-neon">Get Started</button>
</body>
</html>
