<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Card</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111318;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .flip-scene {
    width: 280px;
    height: 360px;
    perspective: 1000px;
    cursor: pointer;
  }

  .flip-card {
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
    position: relative;
  }

  .flip-scene:hover .flip-card {
    transform: rotateY(180deg);
  }

  .flip-face {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
    gap: 14px;
  }

  .flip-front {
    background: linear-gradient(160deg, #1e2a3a, #0f1923);
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff;
  }

  .flip-front .icon {
    font-size: 52px;
    margin-bottom: 4px;
  }

  .flip-front h3 { font-size: 20px; font-weight: 700; }
  .flip-front p { font-size: 13px; opacity: 0.5; }
  .flip-front .hint {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.3;
    margin-top: 12px;
  }

  .flip-back {
    background: linear-gradient(160deg, #1a3a4a, #0f2030);
    border: 1px solid rgba(100, 220, 255, 0.15);
    color: #fff;
    transform: rotateY(180deg);
  }

  .flip-back h3 { font-size: 18px; font-weight: 700; color: #64dcff; }
  .flip-back p { font-size: 13px; opacity: 0.7; line-height: 1.6; }

  .flip-back .tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .flip-back .tag {
    padding: 4px 12px;
    background: rgba(100, 220, 255, 0.12);
    border: 1px solid rgba(100, 220, 255, 0.25);
    border-radius: 20px;
    font-size: 11px;
    color: #64dcff;
  }
</style>
</head>
<body>
  <p class="label">Flip Card</p>
  <div class="flip-scene">
    <div class="flip-card">
      <div class="flip-face flip-front">
        <div class="icon">
          <svg width="44" height="28" viewBox="0 0 88 32" fill="none" stroke="#64dcff" stroke-width="3" stroke-linecap="round">
            <path d="M0,16 Q11,4 22,16 Q33,28 44,16 Q55,4 66,16 Q77,28 88,16"/>
          </svg>
        </div>
        <h3>Coastal Survey</h3>
        <p>12-month tidal monitoring study.</p>
        <span class="hint">Hover to reveal</span>
      </div>
      <div class="flip-face flip-back">
        <h3>Details</h3>
        <p>Tidal patterns collected at 48 sites along the northern shoreline. Report published March 2024.</p>
        <div class="tags">
          <span class="tag">Fieldwork</span>
          <span class="tag">Tidal</span>
          <span class="tag">Survey</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
