<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Reveal Card</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .card-reveal {
    width: 300px;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }

  .card-reveal .cover {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #f97316, #ec4899, #8b5cf6);
    z-index: 2;
    clip-path: inset(0 100% 0 0);
    transition: clip-path 0.6s cubic-bezier(0.77, 0, 0.18, 1);
  }

  .card-reveal:hover .cover {
    clip-path: inset(0 0% 0 0);
  }

  .card-reveal .cover-text {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    opacity: 0;
    transition: opacity 0.3s 0.3s;
    padding: 28px;
    text-align: center;
  }

  .card-reveal:hover .cover-text { opacity: 1; }

  .card-reveal .cover-text h3 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .card-reveal .cover-text p { font-size: 13px; opacity: 0.85; line-height: 1.6; }

  .card-reveal .base {
    background: #1a1a24;
    padding: 28px;
    color: #fff;
  }

  .card-reveal .base .meta {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #f97316;
    margin-bottom: 10px;
  }

  .card-reveal .base h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .card-reveal .base p {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    line-height: 1.6;
  }
</style>
</head>
<body>
  <p class="label">Gradient Reveal Card</p>
  <div class="card-reveal">
    <div class="cover">
      <div class="cover-text">
        <h3>View Series &#x2192;</h3>
        <p>Shot on 35mm, Kodak Portra 400. Developed and scanned by hand.</p>
      </div>
    </div>
    <div class="base">
      <p class="meta">Portfolio</p>
      <h3>Tokyo Street Series</h3>
      <p>30-day photo series shot on film in Shinjuku and Shimokitazawa.</p>
    </div>
  </div>
</body>
</html>
