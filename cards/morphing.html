<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphing Card</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0d0d14;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .card-morph {
    width: 300px;
    padding: 32px;
    background: #14141e;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    color: #fff;
    cursor: pointer;
    transition:
      border-radius 0.6s cubic-bezier(0.4, 0, 0.2, 1),
      transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
      background 0.4s,
      box-shadow 0.4s;
  }

  .card-morph:hover {
    border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
    transform: scale(1.04) rotate(-1deg);
    background: #1a1430;
    box-shadow:
      0 0 0 1px rgba(168, 85, 247, 0.3),
      0 20px 60px rgba(168, 85, 247, 0.2);
    border-color: rgba(168, 85, 247, 0.3);
  }

  .card-morph .icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 20px;
    transition: border-radius 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-morph:hover .icon { border-radius: 50%; }

  .card-morph h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 10px;
    transition: color 0.3s;
  }

  .card-morph:hover h3 { color: #c084fc; }

  .card-morph p {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    line-height: 1.7;
  }
</style>
</head>
<body>
  <p class="label">Morphing Card</p>
  <div class="card-morph">
    <div class="icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 22 12 12 22 2 12"/></svg>
    </div>
    <h3>Morphing Card</h3>
    <p>Hover to watch the border and icon shape transition. Pure CSS, no JavaScript.</p>
  </div>
</body>
</html>
