<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Border Card</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080808;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  @property --border-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  .card-neon-border {
    width: 300px;
    padding: 30px;
    border-radius: 16px;
    background:
      linear-gradient(#0f0f0f, #0f0f0f) padding-box,
      conic-gradient(from var(--border-angle), #ff0080, #ff8c00, #ffe100, #00ff80, #00c8ff, #8000ff, #ff0080) border-box;
    border: 2px solid transparent;
    animation: spin-border 4s linear infinite;
    color: #fff;
  }

  @keyframes spin-border {
    to { --border-angle: 360deg; }
  }

  .card-neon-border .tag {
    display: inline-block;
    padding: 4px 12px;
    background: rgba(255,255,255,0.07);
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 20px;
  }

  .card-neon-border h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff, rgba(255,255,255,0.6));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .card-neon-border p {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    line-height: 1.7;
    margin-bottom: 24px;
  }

  .card-neon-border .price {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
  }

  .card-neon-border .price span {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    font-weight: 400;
  }
</style>
</head>
<body>
  <p class="label">Neon Border Card</p>
  <div class="card-neon-border">
    <span class="tag">Studio Plan</span>
    <h2>Everything included</h2>
    <p>One seat, all projects, no usage caps. Billed monthly, cancel whenever.</p>
    <div class="price">$29 <span>/ month</span></div>
  </div>
</body>
</html>
