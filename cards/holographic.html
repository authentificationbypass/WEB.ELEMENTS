<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holographic Card</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .card-holo {
    width: 290px;
    height: 185px;
    border-radius: 16px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border: 1px solid rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    padding: 22px 24px;
    color: #fff;
    perspective: 600px;
  }

  /* Holographic overlay layer */
  .card-holo::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(255,255,255,0.015) 2px,
        rgba(255,255,255,0.015) 4px
      );
    pointer-events: none;
    z-index: 1;
  }

  /* Color-shift gloss layer */
  .card-holo .gloss {
    position: absolute;
    inset: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
      from 0deg at var(--mx, 50%) var(--my, 50%),
      hsla(0,100%,60%,0.18),
      hsla(60,100%,60%,0.18),
      hsla(120,100%,60%,0.18),
      hsla(180,100%,60%,0.18),
      hsla(240,100%,60%,0.18),
      hsla(300,100%,60%,0.18),
      hsla(360,100%,60%,0.18)
    );
    mix-blend-mode: color-dodge;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 2;
    transform: translate(-25%, -25%);
  }

  .card-holo:hover .gloss { opacity: 1; }

  .card-holo .content { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; }

  .card-holo .logo {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: auto;
  }

  .card-holo .name { font-size: 15px; font-weight: 600; letter-spacing: 1px; margin-bottom: 3px; }
  .card-holo .num { font-size: 12px; letter-spacing: 3px; opacity: 0.45; }

  .card-holo .shimmer-text {
    font-size: 18px;
    font-weight: 800;
    background: linear-gradient(90deg, #fff, #aaa, #fff);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer-move 3s linear infinite;
  }

  @keyframes shimmer-move { to { background-position: 200% center; } }
</style>
</head>
<body>
  <p class="label">Holographic Card</p>
  <div class="card-holo" id="holoCard">
    <div class="gloss" id="holoGloss"></div>
    <div class="content">
      <span class="logo">Nexus</span>
      <div class="shimmer-text">PLATINUM</div>
      <div class="name">Jordan Lee</div>
      <div class="num">•••• •••• •••• 4291</div>
    </div>
  </div>

  <script>
    const card = document.getElementById('holoCard');
    card.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width * 100).toFixed(1);
      const y = ((e.clientY - r.top) / r.height * 100).toFixed(1);
      card.style.setProperty('--mx', `${x}%`);
      card.style.setProperty('--my', `${y}%`);
      const rotX = ((e.clientY - r.top) / r.height - 0.5) * -14;
      const rotY = ((e.clientX - r.left) / r.width - 0.5) * 14;
      card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = '';
    });
  </script>
</body>
</html>
