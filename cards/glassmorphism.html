<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Card</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a1a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 48px;
  }

  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* Background blobs for the glass effect to work on */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    pointer-events: none;
  }
  .blob1 { width: 400px; height: 400px; background: #7c3aed; top: -100px; left: -80px; }
  .blob2 { width: 350px; height: 350px; background: #0ea5e9; bottom: -80px; right: -60px; }
  .blob3 { width: 280px; height: 280px; background: #ec4899; bottom: 100px; left: 100px; }

  /* ── COMPONENT ──────────────────────────────── */
  .card-glass {
    position: relative;
    width: 320px;
    padding: 32px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255,255,255,0.2);
    color: #fff;
    z-index: 1;
  }

  .card-glass .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
  }

  .card-glass h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .card-glass p {
    font-size: 13px;
    opacity: 0.65;
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .card-glass .stats {
    display: flex;
    gap: 24px;
  }

  .card-glass .stat-item span {
    display: block;
  }
  .card-glass .stat-item .num {
    font-size: 20px;
    font-weight: 700;
  }
  .card-glass .stat-item .stat-label {
    font-size: 11px;
    opacity: 0.5;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>
  <p class="label">Glassmorphism Card</p>
  <div class="card-glass">
    <div class="avatar">N</div>
    <h2>Nina Hoffmann</h2>
    <p>Illustrator based in Hamburg. Mostly ink, sometimes pixels.</p>
    <div class="stats">
      <div class="stat-item">
        <span class="num">186</span>
        <span class="stat-label">Works</span>
      </div>
      <div class="stat-item">
        <span class="num">2.4k</span>
        <span class="stat-label">Follows</span>
      </div>
      <div class="stat-item">
        <span class="num">7 yrs</span>
        <span class="stat-label">Active</span>
      </div>
    </div>
  </div>
</body>
</html>
