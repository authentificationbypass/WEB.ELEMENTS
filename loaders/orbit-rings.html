<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Rings Loader</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080810;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 40px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .orbit-loader {
    position: relative;
    width: 80px;
    height: 80px;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid transparent;
  }

  .ring:nth-child(1) {
    inset: 0;
    border-top-color: #00c8ff;
    animation: orbit 1.2s linear infinite;
  }
  .ring:nth-child(2) {
    inset: 12px;
    border-right-color: #ff6b9d;
    animation: orbit 1.8s linear infinite reverse;
  }
  .ring:nth-child(3) {
    inset: 24px;
    border-bottom-color: #ffd93d;
    animation: orbit 1s linear infinite;
  }

  .orbit-dot {
    position: absolute;
    inset: 34px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px #fff;
  }

  @keyframes orbit {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <p class="label">Orbit Rings Loader</p>
  <div class="orbit-loader">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="orbit-dot"></div>
  </div>
</body>
</html>
