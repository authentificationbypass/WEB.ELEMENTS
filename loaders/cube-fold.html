<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube Fold Loader</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    background: linear-gradient(155deg, #07070d, #111325);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  .cube-loader {
    width: 64px;
    height: 64px;
    transform: rotate(45deg);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 4px;
  }

  .cube-cell {
    position: relative;
    transform-style: preserve-3d;
    transform-origin: 100% 100%;
    animation: cube-fold 1.7s infinite ease-in-out;
  }

  .cube-cell::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #00e5ff, #4f46e5);
    box-shadow: 0 0 10px rgba(79, 70, 229, 0.5);
  }

  .cube-cell:nth-child(2) { animation-delay: 0.2s; }
  .cube-cell:nth-child(3) { animation-delay: 0.4s; }
  .cube-cell:nth-child(4) { animation-delay: 0.6s; }

  @keyframes cube-fold {
    0%, 10% { transform: perspective(160px) rotateX(0deg) rotateY(0deg); opacity: 1; }
    25%, 75% { transform: perspective(160px) rotateX(-180deg) rotateY(0deg); opacity: 0.5; }
    90%, 100% { transform: perspective(160px) rotateX(-180deg) rotateY(-180deg); opacity: 1; }
  }
</style>
</head>
<body>
  <p class="label">Cube Fold Loader</p>
  <div class="cube-loader">
    <div class="cube-cell"></div>
    <div class="cube-cell"></div>
    <div class="cube-cell"></div>
    <div class="cube-cell"></div>
  </div>
</body>
</html>
