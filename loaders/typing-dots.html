<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Dots Loader</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0e0e14;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 40px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .typing-bubble {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #1e1e2e;
    border-radius: 20px 20px 20px 4px;
    padding: 14px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .typing-bubble .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    animation: type-dot 1.4s ease-in-out infinite;
  }

  .typing-bubble .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes type-dot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30%            { transform: translateY(-8px); opacity: 1; background: #60a5fa; }
  }
</style>
</head>
<body>
  <p class="label">Typing Dots Loader</p>
  <div class="typing-bubble">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</body>
</html>
