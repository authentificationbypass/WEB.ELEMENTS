<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphing Blob Loader</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a10;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 40px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .blob-loader {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    animation: blob-morph 3s ease-in-out infinite, blob-spin 6s linear infinite;
    filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.6));
  }

  @keyframes blob-morph {
    0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    25%       { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
    50%       { border-radius: 50% 60% 30% 60% / 30% 60% 70% 40%; }
    75%       { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
  }

  @keyframes blob-spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <p class="label">Morphing Blob Loader</p>
  <div class="blob-loader"></div>
</body>
</html>
