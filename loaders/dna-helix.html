<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Helix Loader</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080810;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 40px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .dna {
    display: flex;
    gap: 6px;
    align-items: center;
    height: 60px;
  }

  .dna .node {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    animation: dna-bounce 1.2s ease-in-out infinite;
  }

  .dna .node:nth-child(odd)  { background: #00c8ff; }
  .dna .node:nth-child(even) { background: #ff6b9d; animation-direction: reverse; }

  .dna .node:nth-child(1)  { animation-delay: 0s; }
  .dna .node:nth-child(2)  { animation-delay: 0.1s; }
  .dna .node:nth-child(3)  { animation-delay: 0.2s; }
  .dna .node:nth-child(4)  { animation-delay: 0.3s; }
  .dna .node:nth-child(5)  { animation-delay: 0.4s; }
  .dna .node:nth-child(6)  { animation-delay: 0.5s; }
  .dna .node:nth-child(7)  { animation-delay: 0.6s; }
  .dna .node:nth-child(8)  { animation-delay: 0.7s; }
  .dna .node:nth-child(9)  { animation-delay: 0.8s; }
  .dna .node:nth-child(10) { animation-delay: 0.9s; }

  @keyframes dna-bounce {
    0%, 100% { transform: translateY(-20px) scale(1.1); }
    50%       { transform: translateY(20px) scale(0.8); }
  }
</style>
</head>
<body>
  <p class="label">DNA Helix Loader</p>
  <div class="dna">
    <span class="node"></span><span class="node"></span><span class="node"></span>
    <span class="node"></span><span class="node"></span><span class="node"></span>
    <span class="node"></span><span class="node"></span><span class="node"></span>
    <span class="node"></span>
  </div>
</body>
</html>
