<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Fill Loader</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080810;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 40px;
  }
  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .liquid-loader {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.1);
    overflow: hidden;
    position: relative;
    background: #0e0e18;
  }

  .liquid-loader .wave-svg {
    position: absolute;
    width: 200%;
    bottom: 12%;
    left: -50%;
    animation: wave-slide 2s linear infinite;
  }

  .liquid-loader .fill-rect {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 45%;
    background: rgba(99, 102, 241, 0.5);
  }

  @keyframes wave-slide {
    from { transform: translateX(0); }
    to   { transform: translateX(50%); }
  }

  .liquid-loader .pct {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    z-index: 2;
  }
</style>
</head>
<body>
  <p class="label">Liquid Fill Loader</p>
  <div class="liquid-loader">
    <div class="fill-rect"></div>
    <svg class="wave-svg" viewBox="0 0 200 20" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,10 C30,0 70,20 100,10 C130,0 170,20 200,10 L200,20 L0,20 Z" fill="rgba(99,102,241,0.7)"/>
    </svg>
    <span class="pct">67%</span>
  </div>
</body>
</html>
