<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glitch Text Animation</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #050508;
    font-family: 'Courier New', monospace;
    gap: 48px;
    overflow: hidden;
  }

  .label {
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.3;
  }

  /* ── COMPONENT ──────────────────────────────── */
  .glitch {
    position: relative;
    font-size: 56px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 6px;
    text-transform: uppercase;
    animation: glitch-shake 4s steps(1) infinite;
  }

  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    color: #fff;
  }

  /* Red channel */
  .glitch::before {
    color: #ff003c;
    animation: glitch-r 4s steps(1) infinite;
    clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
  }

  /* Blue channel */
  .glitch::after {
    color: #0084ff;
    animation: glitch-b 4s steps(1) infinite;
    clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
  }

  @keyframes glitch-shake {
    0%, 90%, 100% { transform: translate(0, 0); }
    92%           { transform: translate(-2px, 1px); }
    94%           { transform: translate(2px, -1px); }
    96%           { transform: translate(-1px, 2px); }
    98%           { transform: translate(1px, -2px); }
  }

  @keyframes glitch-r {
    0%, 88%, 100% { transform: translate(0, 0); opacity: 0; }
    90%           { transform: translate(-4px, 2px); opacity: 0.85; }
    92%           { transform: translate(3px, -1px); opacity: 0.7; }
    94%           { transform: translate(-2px, 3px); opacity: 0.85; }
    96%           { transform: translate(4px, 0px); opacity: 0; }
  }

  @keyframes glitch-b {
    0%, 88%, 100% { transform: translate(0, 0); opacity: 0; }
    91%           { transform: translate(4px, -2px); opacity: 0.85; }
    93%           { transform: translate(-3px, 1px); opacity: 0.7; }
    95%           { transform: translate(2px, -3px); opacity: 0.85; }
    97%           { transform: translate(-4px, 0px); opacity: 0; }
  }
</style>
</head>
<body>
  <p class="label">Glitch Text</p>
  <h1 class="glitch" data-text="GLITCH">GLITCH</h1>
</body>
</html>
