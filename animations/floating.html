<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Elements Animation</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080810;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 40px;
    overflow: hidden;
  }

  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; z-index: 1; }

  /* ── COMPONENT ──────────────────────────────── */
  .float-scene {
    position: relative;
    width: 320px;
    height: 280px;
  }

  .float-item {
    position: absolute;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    animation: float-bob linear infinite;
  }

  .float-item:nth-child(1) { width: 80px; height: 80px; background: linear-gradient(135deg,#6366f1,#818cf8); top: 20px; left: 20px; animation-duration: 4s; animation-delay: 0s; }
  .float-item:nth-child(2) { width: 64px; height: 64px; background: linear-gradient(135deg,#ec4899,#f472b6); top: 10px; right: 30px; animation-duration: 3.5s; animation-delay: -1s; }
  .float-item:nth-child(3) { width: 72px; height: 72px; background: linear-gradient(135deg,#06b6d4,#22d3ee); bottom: 40px; left: 60px; animation-duration: 4.5s; animation-delay: -2s; }
  .float-item:nth-child(4) { width: 56px; height: 56px; background: linear-gradient(135deg,#f97316,#fb923c); bottom: 20px; right: 40px; animation-duration: 3.8s; animation-delay: -0.5s; }
  .float-item:nth-child(5) { width: 48px; height: 48px; background: linear-gradient(135deg,#10b981,#34d399); top: 50%; left: 50%; transform: translate(-50%,-50%); animation-duration: 5s; animation-delay: -1.5s; }

  @keyframes float-bob {
    0%, 100% { transform: translateY(0px); }
    25%       { transform: translateY(-12px) rotate(3deg); }
    75%       { transform: translateY(6px) rotate(-2deg); }
  }

  /* Override transform-origin for center item */
  .float-item:nth-child(5) {
    animation-name: float-bob-center;
  }
  @keyframes float-bob-center {
    0%, 100% { transform: translate(-50%,-50%) translateY(0px); }
    25%       { transform: translate(-50%,-50%) translateY(-12px) rotate(3deg); }
    75%       { transform: translate(-50%,-50%) translateY(6px) rotate(-2deg); }
  }
</style>
</head>
<body>
  <p class="label">Floating Elements</p>
  <div class="float-scene">
    <div class="float-item"></div>
    <div class="float-item"></div>
    <div class="float-item"></div>
    <div class="float-item"></div>
    <div class="float-item"></div>
  </div>
</body>
</html>
