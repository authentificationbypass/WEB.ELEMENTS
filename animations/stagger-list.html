<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stagger List Animation</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0e0e14;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 32px;
  }

  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  .stagger-list {
    list-style: none;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .stagger-list li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: #1a1a26;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    color: rgba(255,255,255,0.75);
    font-size: 14px;
    opacity: 0;
    transform: translateX(-24px);
    transition:
      opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .stagger-list li.visible { opacity: 1; transform: translateX(0); }

  .stagger-list li .icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .stagger-list li:nth-child(1) .icon { background: rgba(99,102,241,0.2); color: #818cf8; }
  .stagger-list li:nth-child(2) .icon { background: rgba(236,72,153,0.2); color: #f472b6; }
  .stagger-list li:nth-child(3) .icon { background: rgba(6,182,212,0.2); color: #22d3ee; }
  .stagger-list li:nth-child(4) .icon { background: rgba(234,179,8,0.2); color: #fbbf24; }
  .stagger-list li:nth-child(5) .icon { background: rgba(16,185,129,0.2); color: #34d399; }

  .replay {
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
    background: none;
    color: rgba(255,255,255,0.3);
    padding: 7px 18px;
    border-radius: 20px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .replay:hover { border-color: rgba(255,255,255,0.3); }
</style>
</head>
<body>
  <p class="label">Stagger List</p>
  <ul class="stagger-list" id="list">
    <li>
      <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
      Open file
    </li>
    <li>
      <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>
      Edit content
    </li>
    <li>
      <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
      View history
    </li>
    <li>
      <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></span>
      Share project
    </li>
    <li>
      <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
      Export PDF
    </li>
  </ul>
  <button class="replay" id="replayBtn">Replay</button>

  <script>
    const items = document.querySelectorAll('#list li');

    function animate() {
      items.forEach(el => { el.classList.remove('visible'); });
      items.forEach((el, i) => {
        setTimeout(() => el.classList.add('visible'), 100 + i * 110);
      });
    }

    document.getElementById('replayBtn').addEventListener('click', animate);
    animate();
  </script>
</body>
</html>
