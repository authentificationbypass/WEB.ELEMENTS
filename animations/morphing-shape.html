<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphing Shape Animation</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080810;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 40px;
  }

  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }
  .shape-name { color: rgba(255,255,255,0.35); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }

  /* ── COMPONENT ──────────────────────────────── */
  .morph-svg {
    width: 200px;
    height: 200px;
  }

  .morph-svg polygon {
    fill: url(#morphGrad);
    filter: drop-shadow(0 0 20px rgba(99,102,241,0.5));
  }
</style>
</head>
<body>
  <p class="label">Morphing Shape</p>
  <svg class="morph-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="morphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6366f1"/>
        <stop offset="100%" stop-color="#ec4899"/>
      </linearGradient>
    </defs>
    <polygon id="morphShape" points="50,5 95,27 95,73 50,95 5,73 5,27"/>
  </svg>
  <p class="shape-name" id="shapeName">Hexagon</p>

  <script>
    const poly = document.getElementById('morphShape');
    const nameEl = document.getElementById('shapeName');

    const shapes = [
      { name: 'Triangle',  pts: '50,5 95,90 5,90' },
      { name: 'Square',    pts: '10,10 90,10 90,90 10,90' },
      { name: 'Pentagon',  pts: '50,5 98,36 80,90 20,90 2,36' },
      { name: 'Hexagon',   pts: '50,5 95,27 95,73 50,95 5,73 5,27' },
      { name: 'Star',      pts: '50,2 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35' },
      { name: 'Diamond',   pts: '50,5 95,50 50,95 5,50' },
    ];

    let current = 3;

    function morph(toIndex) {
      const shape = shapes[toIndex];
      poly.setAttribute('points', shape.pts);
      nameEl.textContent = shape.name;
    }

    // CSS transition on the polygon
    poly.style.transition = 'all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';

    function cycle() {
      current = (current + 1) % shapes.length;
      morph(current);
    }

    setInterval(cycle, 1800);
  </script>
</body>
</html>
