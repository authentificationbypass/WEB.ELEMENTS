<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetic Cursor</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080810;
    font-family: 'Segoe UI', system-ui, sans-serif;
    gap: 40px;
    cursor: none;
    overflow: hidden;
  }

  .label { color: #fff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.3; }

  /* ── COMPONENT ──────────────────────────────── */
  #cursor-dot {
    position: fixed;
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, background 0.2s;
  }

  #cursor-ring {
    position: fixed;
    width: 36px;
    height: 36px;
    border: 1.5px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s, border-color 0.3s;
  }

  body:has(a:hover) #cursor-ring,
  body:has(button:hover) #cursor-ring {
    width: 56px;
    height: 56px;
    border-color: rgba(99,102,241,0.7);
  }

  .demo-area {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .demo-area a, .demo-area button {
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    padding: 10px 24px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    background: #14141e;
    cursor: none;
    transition: background 0.2s;
  }

  .demo-area a:hover, .demo-area button:hover { background: #1e1e30; }

  p.sub { color: rgba(255,255,255,0.2); font-size: 13px; }
</style>
</head>
<body>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <p class="label">Magnetic Cursor</p>
  <p class="sub">Move your mouse around the page</p>
  <div class="demo-area">
    <a href="#">Link</a>
    <button>Button</button>
    <a href="#">Another</a>
  </div>

  <script>
    const dot  = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');

    let mx = 0, my = 0;
    let rx = 0, ry = 0;
    const LERP = 0.12;

    document.addEventListener('mousemove', (e) => {
      mx = e.clientX;
      my = e.clientY;
      dot.style.left = mx + 'px';
      dot.style.top  = my + 'px';
    });

    function loop() {
      rx += (mx - rx) * LERP;
      ry += (my - ry) * LERP;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
