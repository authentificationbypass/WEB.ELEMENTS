<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotlight Mask Reveal</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 18% 18%, rgba(255, 180, 100, 0.18), transparent 36%),
      radial-gradient(circle at 82% 78%, rgba(84, 152, 255, 0.2), transparent 38%),
      #0d0f13;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    overflow: hidden;
    padding: 24px;
  }

  .stage {
    position: relative;
    width: min(92vw, 920px);
    min-height: 52vh;
    border-radius: 24px;
    background: linear-gradient(155deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.16);
    overflow: hidden;
    isolation: isolate;
  }

  .text {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(2rem, 11vw, 6.8rem);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.08);
    user-select: none;
  }

  .shine {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(2rem, 11vw, 6.8rem);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ffb366, #ffe387 30%, #7cd0ff 70%, #d2fff4);
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    pointer-events: none;
    mask-image: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(0,0,0,1) 0, rgba(0,0,0,1) 110px, rgba(0,0,0,0) 200px);
    -webkit-mask-image: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(0,0,0,1) 0, rgba(0,0,0,1) 110px, rgba(0,0,0,0) 200px);
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), transparent 100px, rgba(0,0,0,0.5) 270px);
    pointer-events: none;
  }

  .label {
    position: absolute;
    top: 14px;
    left: 18px;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <p class="label">Spotlight Mask Reveal</p>
    <div class="text">Ignite</div>
    <div class="shine" id="shine">Ignite</div>
    <div class="vignette" id="vignette"></div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const shine = document.getElementById('shine');
    const vignette = document.getElementById('vignette');

    function setSpotlight(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * 100;
      const y = ((clientY - rect.top) / rect.height) * 100;

      shine.style.setProperty('--x', `${x}%`);
      shine.style.setProperty('--y', `${y}%`);
      vignette.style.setProperty('--x', `${x}%`);
      vignette.style.setProperty('--y', `${y}%`);
    }

    stage.addEventListener('pointermove', (e) => setSpotlight(e.clientX, e.clientY));

    stage.addEventListener('pointerleave', () => {
      shine.style.setProperty('--x', '50%');
      shine.style.setProperty('--y', '50%');
      vignette.style.setProperty('--x', '50%');
      vignette.style.setProperty('--y', '50%');
    });
  </script>
</body>
</html>
